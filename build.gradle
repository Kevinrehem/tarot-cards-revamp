plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = property('mod_version')
group = property('mod_group_id')

base {
    archivesName = property('mod_id')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = property('neo_version')

    parchment {
        minecraftVersion = property('minecraft_version')
        mappingsVersion = '2026.01.01'
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', property('mod_id')
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', property('mod_id')
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', property('mod_id')
        }
        data {
            data()
            programArguments.addAll '--mod', property('mod_id'), '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${property('mod_id')}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "OctoStudios / Curios"
        url = "https://maven.octo-studios.com/releases"
    }
    maven {
        name = "Illusive Soulworks Maven"
        url = "https://maven.theillusivec4.top/"
    }
}

dependencies {
    // Soft compile dependency for Curios API if available on maven
    compileOnly "top.theillusivec4.curios:curios-neoforge:26.3.0.95:api"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
